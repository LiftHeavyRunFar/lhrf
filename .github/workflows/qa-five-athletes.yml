name: Five athlete isolated acceptance
on:
  pull_request:
    paths:
      - 'tests/v1406-five-journeys.browser.cjs'
      - '.github/workflows/qa-five-athletes.yml'
  workflow_dispatch:
jobs:
  five-athlete-ui:
    name: Five clean athlete journeys — Pixel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Execute isolated athlete onboarding, preview, logging, reload
        env:
          LHRF_QA_OUT: /tmp/lhrf-five-journeys
        run: node tests/v1406-five-journeys.browser.cjs
      - name: Preserve individual results and error screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1406-five-athlete-ui
          path: /tmp/lhrf-five-journeys/
