name: Coaching v2 tests
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'services/**'
      - 'index.html'
      - 'coaching-preview.html'
      - 'sw.js'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/coaching-v2.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'services/**'
      - 'index.html'
      - 'coaching-preview.html'
      - 'sw.js'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/coaching-v2.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Exact saved-output hashes were recorded on this runtime (PR #107).
          # V8 Math.pow differs in its last bits on Node 22; keep the frozen hashes.
          node-version: '24.19.0'
      - name: Run coaching v2 tests
        run: npm test

  athlete-coaching-gates:
    name: Athlete bots — coaching acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay synthetic athletes and check coaching gates
        run: node scripts/test-athletes.cjs --json > athlete-report.json
      - name: Retain the full report, including blocked gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-athlete-report
          path: athlete-report.json

  five-scenario-baseline:
    name: Coaching replay safety (programme feasibility reported separately)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify engine safety; retain blocked programme feasibility outcomes
        run: npm run test:coaching:safety
      - name: Check prescription-level recovery, taper and calibration criteria
        run: npm run test:coaching:depth
      - name: Retain exact outputs and mapping limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-scenario-engine-baseline
          path: docs/qa/coaching-rounds-current/

  shared-coach-browser:
    name: Shared engine — browser and PWA upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select browser for regression checks
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Test cross-programme performance references and production PWA update
        if: ${{ !cancelled() }}
        env:
          LHRF_PREVIOUS_ROOT: /tmp/lhrf-history-production
        run: |
          mkdir -p /tmp/lhrf-history-production
          git archive 776df9c21d2e96ca506e4e40d27988565d03efbf | tar -x -C /tmp/lhrf-history-production
          node tests/performance-history.browser.cjs
      - name: Test current production update with history and Garmin export together
        if: ${{ !cancelled() }}
        env:
          LHRF_COMBINED_BASE: /tmp/lhrf-history-garmin-production
        run: |
          mkdir -p /tmp/lhrf-history-garmin-production
          git archive 719ef246d27f40796beaec194c5ffc2db986aa75 | tar -x -C /tmp/lhrf-history-garmin-production
          node tests/history-garmin-update.browser.cjs
      - name: Test Training Mode, purpose-aware references and production PWA update
        if: ${{ !cancelled() }}
        env:
          LHRF_TRAINING_BASE: /tmp/lhrf-training-production
        run: |
          mkdir -p /tmp/lhrf-training-production
          git archive 385a4bc66c14e47e2b7c3ed668b9037462a7e3a9 | tar -x -C /tmp/lhrf-training-production
          node tests/training-mode.browser.cjs
      - name: Test save-gated exercise progression and compatible actual-load carry
        if: ${{ !cancelled() }}
        env:
          LHRF_FLOW_BASE: /tmp/lhrf-training-flow-start
        run: |
          mkdir -p /tmp/lhrf-training-flow-start
          git archive 305adc9570d9df91d4f357c8f0108bd484402ea2 | tar -x -C /tmp/lhrf-training-flow-start
          node tests/training-flow.browser.cjs
      - name: Test all tabs and workout flow
        if: ${{ !cancelled() }}
        run: node tests/today-flow.browser.cjs
      - name: Test preview to live logging and shared review
        if: ${{ !cancelled() }}
        run: node tests/shared-preview.browser.cjs
      - name: Test new athlete onboarding and policy selection
        if: ${{ !cancelled() }}
        run: node tests/onboarding-athletes.browser.cjs
      - name: Test missing-experience performance calibration and saved programme boundary
        if: ${{ !cancelled() }}
        run: node tests/experience-calibration.browser.cjs
      - name: Test personal Garmin import review and data integrity
        if: ${{ !cancelled() }}
        run: node tests/garmin-import.browser.cjs
      - name: Test reviewed local Garmin files and atomic saves
        if: ${{ !cancelled() }}
        run: node tests/local-activity-import.browser.cjs
      - name: Test prescribed-run export dates, recovery roles and safe failures
        if: ${{ !cancelled() }}
        run: node tests/garmin-export.browser.cjs
      - name: Test canonical running preview, timer, export and logging
        if: ${{ !cancelled() }}
        run: node tests/running-flow.browser.cjs
      - name: Test install icons and approved programme activation
        if: ${{ !cancelled() }}
        run: node tests/release.browser.cjs
      - name: Test approved bench roles and Friday live workout
        if: ${{ !cancelled() }}
        run: node tests/bench-exposure.browser.cjs
      - name: Test new-programme shared coaching defaults and approval boundary
        if: ${{ !cancelled() }}
        run: node tests/general-coaching.browser.cjs
      - name: Test version-two intake, full-horizon approval and priority handover
        if: ${{ !cancelled() }}
        run: node tests/coaching-intake-v2.browser.cjs
      - name: Test isolated version-two preview and saved prescription review
        if: ${{ !cancelled() }}
        run: node tests/preview-intake-v2.browser.cjs
      - name: Prepare pre-extraction PWA fixture
        if: ${{ !cancelled() }}
        run: |
          git fetch origin 58bbb0ba3603a36b40cbe1587b9d388e474a57c6
          mkdir -p /tmp/lhrf-previous
          git archive 58bbb0ba3603a36b40cbe1587b9d388e474a57c6 | tar -x -C /tmp/lhrf-previous
      - name: Test PWA update and offline data preservation
        if: ${{ !cancelled() }}
        env:
          LHRF_PREVIOUS_ROOT: /tmp/lhrf-previous
        run: node tests/shared-update.browser.cjs

      - name: Test flexible time estimates and shortened workouts on mobile
        if: ${{ !cancelled() }}
        run: node tests/flexible-session-time.browser.cjs

      - name: Test verified replacement, interruption, rollback and race consent on mobile
        if: ${{ !cancelled() }}
        run: node tests/programme-replacement.browser.cjs

      - name: Test equipment eligibility, Settings removal and offline start rejection
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lhrf-equipment-http.log 2>&1 &
          equipment_server_pid=$!
          trap 'kill "$equipment_server_pid"' EXIT
          node tests/equipment.browser.cjs

      - name: Test mobile settings, equipment persistence and weekly recovery
        if: ${{ !cancelled() }}
        run: node tests/mobile-ux.browser.cjs
      - name: Test preview touch scroll, focus and prior-week reference
        if: ${{ !cancelled() }}
        run: node tests/mobile-workout.browser.cjs
      - name: Test Progress hierarchy, recorded runs and source preservation
        if: ${{ !cancelled() }}
        run: node tests/mobile-progress.browser.cjs
      - name: Prepare production main for combined release upgrade acceptance
        if: ${{ !cancelled() && github.head_ref == 'release/mobile-ux-115-rc' }}
        run: |
          mkdir -p /tmp/lhrf-production-115
          git archive 49433e748dd1090c205e954e915a4490cb820a56 | tar -x -C /tmp/lhrf-production-115
      - name: Verify protected production files and record candidate identity
        if: ${{ !cancelled() && github.head_ref == 'release/mobile-ux-115-rc' }}
        env:
          LHRF_PRODUCTION_ROOT: /tmp/lhrf-production-115
          LHRF_RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/mobile-release-integrity.cjs
      - name: Test combined production update, late check-ins and history integrity
        if: ${{ !cancelled() && github.head_ref == 'release/mobile-ux-115-rc' }}
        env:
          LHRF_PRODUCTION_ROOT: /tmp/lhrf-production-115
        run: node tests/combined-mobile-release.browser.cjs
      - name: Prepare current production baseline for Android acceptance
        if: ${{ !cancelled() && github.head_ref == 'fix/android-equipment-and-ux' }}
        run: |
          mkdir -p /tmp/lhrf-android-production
          git archive e92e843e72482ecaf754672c5eac1aba733ea50b | tar -x -C /tmp/lhrf-android-production
      - name: Verify Android workout-start and settings corrections
        if: ${{ !cancelled() && github.head_ref == 'fix/android-equipment-and-ux' }}
        env:
          LHRF_ANDROID_BASE: /tmp/lhrf-android-production
        run: node tests/android-corrections.browser.cjs
      - name: Final Android polish acceptance against production main
        if: ${{ !cancelled() && github.head_ref == 'fix/final-android-polish-122' }}
        env:
          LHRF_ANDROID_BASE: /tmp/lhrf-polish-production
        run: |
          mkdir -p /tmp/lhrf-polish-production
          git archive da1d8babd9fabbe5f5bb29e43269f44a1aae4914 | tar -x -C /tmp/lhrf-polish-production
          node tests/final-polish.browser.cjs
      - name: Retain synthetic mobile UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ux-115-evidence
          path: |
            docs/ux-115/*.png
            docs/ux-115/combined-release.md
            docs/ux-115/android-corrections.md
            docs/ux-115/combined-integrity.json
