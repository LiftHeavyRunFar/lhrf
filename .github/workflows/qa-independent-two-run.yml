name: Independent two-run marathon QA
on:
  pull_request:
    paths:
      - 'tests/independent-two-run-marathon.test.cjs'
      - 'tests/independent-two-run-journey.browser.cjs'
      - '.github/workflows/qa-independent-two-run.yml'
jobs:
  independent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 2e31f800e48600f2282d18964216bcffc51e4370
          path: candidate
      - name: Checkout pre-existing baseline
        uses: actions/checkout@v4
        with:
          ref: 87046db2925e1db2dd6e0af71d4b0c72b3d60395
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Test generated programmes and synthetic athlete journeys
        env:
          LHRF_TEST_ROOT: ${{ github.workspace }}/candidate
          LHRF_BASE_ROOT: ${{ github.workspace }}/baseline
        run: |
          node --test tests/independent-two-run-marathon.test.cjs
          node tests/independent-two-run-journey.browser.cjs
