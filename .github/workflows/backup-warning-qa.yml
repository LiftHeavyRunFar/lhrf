name: Backup warning acceptance
on:
  pull_request:
    paths:
      - index.html
      - tests/backup-warning.browser.cjs
      - .github/workflows/backup-warning-qa.yml
  workflow_dispatch:
jobs:
  backup-warning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Exercise warnings and restore
        run: node tests/backup-warning.browser.cjs
