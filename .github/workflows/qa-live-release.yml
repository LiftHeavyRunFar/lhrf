name: Live release inspection
on:
  pull_request:
    paths:
      - 'tests/live-release-inspection.cjs'
      - '.github/workflows/qa-live-release.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/live-release-inspection.cjs
