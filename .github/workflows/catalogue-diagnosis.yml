name: Catalogue release diagnosis
on: pull_request
jobs:
  catalogue-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Run catalogue browser test
        run: CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node tests/catalogue-preview.browser.cjs
