name: Personal 13-week programme acceptance
on:
  pull_request:
  workflow_dispatch:
jobs:
  personal-programme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/personal-sbd-2027.test.cjs tests/personal-clean-start.test.cjs tests/programme-replacement.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Prepare exact current production baseline
        run: |
          mkdir -p /tmp/lhrf-personal-production
          git archive 87046db2925e1db2dd6e0af71d4b0c72b3d60395 | tar -x -C /tmp/lhrf-personal-production
      - run: node tests/personal-sbd-2027.browser.cjs
        env:
          LHRF_PERSONAL_PRODUCTION_ROOT: /tmp/lhrf-personal-production
      - name: Prepare current 1.41.0 for blocked-update reproduction
        run: |
          mkdir -p /tmp/lhrf-clean-production
          git archive aa4d25b8c0d768ff53d6797ab0b185d2c5741553 | tar -x -C /tmp/lhrf-clean-production
      - run: node tests/personal-clean-start.browser.cjs
        env:
          LHRF_CLEAN_BASE: /tmp/lhrf-clean-production
