name: Single-tab warning
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/single-tab-warning.browser.cjs'
      - '.github/workflows/qa-single-tab-warning.yml'
  workflow_dispatch:
jobs:
  warning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tests/single-tab-warning.browser.cjs
