name: Legacy observer recovery diagnostic
on:
  pull_request:
    paths:
      - 'tests/legacy-observer-recovery.browser.cjs'
      - '.github/workflows/qa-legacy-observer.yml'
jobs:
  observer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout actual old client
        uses: actions/checkout@v4
        with:
          ref: 87046db2925e1db2dd6e0af71d4b0c72b3d60395
          path: production-v1406
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tests/legacy-observer-recovery.browser.cjs
