name: Catalogue event preview acceptance
on:
  pull_request:
    paths:
      - 'catalogue-preview/app.js'
      - 'tests/catalogue-event-preview.browser.cjs'
      - '.github/workflows/qa-event-preview.yml'
  workflow_dispatch:
jobs:
  event-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run native event preview tests
        run: node tests/catalogue-event-preview.browser.cjs
