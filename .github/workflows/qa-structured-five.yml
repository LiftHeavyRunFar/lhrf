name: Structured catalogue athlete journeys
on:
  pull_request:
    paths:
      - 'tests/structured-five-athletes.browser.cjs'
      - '.github/workflows/qa-structured-five.yml'
  workflow_dispatch:
jobs:
  journeys:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Execute five structured athlete journeys
        run: node tests/structured-five-athletes.browser.cjs
      - name: Retain individual results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-five-athletes
          path: /tmp/lhrf-structured-five/
