name: Comparable race safeguard QA
on:
  pull_request:
    paths:
      - 'src/training-review.js'
      - 'tests/training-review.test.cjs'
      - 'tests/comparable-race.browser.cjs'
      - '.github/workflows/qa-comparable-race.yml'
jobs:
  comparable-race:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/training-review.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tests/comparable-race.browser.cjs
      - run: node tests/mobile-progress.browser.cjs
