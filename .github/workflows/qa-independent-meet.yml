name: Independent meet transition QA
on:
  pull_request:
    paths:
      - 'tests/owner-site-fixture/**'
      - 'tests/owner-site-fixture.sha256'
      - 'tests/owner-site-meet.browser.cjs'
      - 'tests/owner-site-partial.browser.cjs'
      - 'tests/owner-rollover.browser.cjs'
      - 'tests/owner-running-rollover.browser.cjs'
      - 'tests/meet-matrix-independent.test.cjs'
      - 'tests/meet-independent.browser.cjs'
      - 'tests/meet-partial-independent.browser.cjs'
      - '.github/workflows/qa-independent-meet.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/meet-matrix-independent.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tests/meet-independent.browser.cjs
      - run: node tests/meet-partial-independent.browser.cjs
      - run: sha256sum -c tests/owner-site-fixture.sha256
      - run: node tests/owner-site-meet.browser.cjs
      - run: node tests/owner-site-partial.browser.cjs
      - run: node tests/owner-rollover.browser.cjs
      - run: node tests/owner-running-rollover.browser.cjs
