name: Beta workout cutover rehearsal

on:
  pull_request:
    paths:
      - 'src/beta-cutover.js'
      - 'tests/beta-cutover*'
      - '.github/workflows/qa-beta-cutover.yml'

jobs:
  beta-cutover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout pinned legacy client
        uses: actions/checkout@v4
        with:
          ref: 87046db2925e1db2dd6e0af71d4b0c72b3d60395
          path: production-v1406
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/beta-cutover.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tests/beta-cutover.browser.cjs
      - name: Recheck normal native workout save and reload
        if: ${{ !cancelled() }}
        run: node tests/today-flow.browser.cjs
