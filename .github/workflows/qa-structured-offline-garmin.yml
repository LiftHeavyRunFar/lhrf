name: Structured offline and Garmin preservation
on:
  pull_request:
    paths:
      - tests/structured-offline-garmin.browser.cjs
      - .github/workflows/qa-structured-offline-garmin.yml
jobs:
  offline-preservation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tests/structured-offline-garmin.browser.cjs
